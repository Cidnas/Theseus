[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "Theseus"
dynamic = ["version"]
description = "Embed the local Codex app-server in Python applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["theseus*"]

[tool.setuptools.dynamic]
version = {attr = "theseus._version.__version__"}
