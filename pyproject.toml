[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
dynamic = ["version"]
description = "Embed the local Codex app-server in Python applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["codeagent*"]

[tool.setuptools.dynamic]
version = {attr = "codeagent._version.__version__"}
